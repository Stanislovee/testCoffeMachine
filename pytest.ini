# pytest.ini - конфігурація Pytest

[pytest]
# Шляхи до тестів
testpaths = tests

# Додаткові параметри за замовчуванням
addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=5
    -p no:warnings

# Налаштування виводу
console_output_style = progress

# Маркери (дублюємо з conftest.py для безпеки)
markers =
    smoke: Smoke tests - basic functionality
    regression: Regression tests - ensure no bugs
    slow: Slow tests - can be skipped
    ui: UI tests